name: Keep Render demo awake

# Render free web services sleep after 15 minutes without traffic.
# GitHub scheduled runs can be delayed, so ping every 10 minutes for margin.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            https://ai-knowledge-engine-wcmz.onrender.com/health
